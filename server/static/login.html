<!DOCTYPE html>
<html lang="en" data-i18n-doctitle="loginPageTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shockr — Log in</title>
<script src="static/i18n.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #1a1a1a;
        color: #ccc;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-size: 14px;
    }
    .header {
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }
    .header h1 { font-size: 18px; color: #e0e0e0; }
    .login {
        max-width: 380px;
        margin: 60px auto;
        padding: 24px;
        background: #222;
        border: 1px solid #333;
        border-radius: 6px;
    }
    .login p { color: #999; font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
    .login label { display: block; color: #999; font-size: 12px; margin-bottom: 4px; }
    .login input {
        width: 100%;
        background: #333;
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 3px;
        padding: 8px;
        font-size: 14px;
        margin-bottom: 14px;
    }
    .login input:focus { outline: none; border-color: #4fc3f7; }
    .login button {
        width: 100%;
        background: #4fc3f7;
        color: #1a1a1a;
        border: none;
        border-radius: 3px;
        padding: 9px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .login button:hover { background: #81d4fa; }
    .login button:disabled { background: #555; cursor: default; }
    .error { color: #ef5350; font-size: 13px; margin-top: 12px; min-height: 18px; }
    @media (max-width: 440px) { .login { margin: 24px 16px; } }
</style>
</head>
<body>

<div class="header">
    <h1>⚔ Shockr Alliance Scanner</h1>
    <span class="lang-switch" id="langSwitch"></span>
</div>

<form class="login" id="loginForm">
    <p data-i18n="loginIntro"></p>
    <label for="playerName" data-i18n="loginName"></label>
    <input id="playerName" name="playerName" autocomplete="username" required maxlength="50" autofocus data-i18n-placeholder="loginNamePlaceholder">
    <label for="apiKey" data-i18n="loginKey"></label>
    <input id="apiKey" name="apiKey" type="password" autocomplete="current-password" required maxlength="100" data-i18n-placeholder="loginKeyPlaceholder">
    <button type="submit" id="loginBtn" data-i18n="loginButton"></button>
    <div class="error" id="error" role="alert"></div>
</form>

<script>
// Error shown last, so a language switch can re-translate it
let lastErrorKey = null;
function showError(key) {
    lastErrorKey = key;
    document.getElementById('error').textContent = key ? T(key) : '';
}
document.addEventListener('shockr-lang', () => showError(lastErrorKey));

document.getElementById('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById('loginBtn');
    showError(null);
    btn.disabled = true;
    try {
        const resp = await fetch('api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                playerName: document.getElementById('playerName').value.trim(),
                apiKey: document.getElementById('apiKey').value.trim(),
            }),
        });
        if (resp.ok) {
            location.href = './';
            return;
        }
        showError(resp.status === 429 ? 'loginRateLimited' : 'loginFailed');
    } catch (e) {
        showError('loginUnreachable');
    } finally {
        btn.disabled = false;
    }
});
</script>
</body>
</html>
