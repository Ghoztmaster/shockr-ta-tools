<!DOCTYPE html>
<html lang="en" data-i18n-doctitle="targetsPageTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shockr Target Watch</title>
<script src="static/i18n.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #1a1a1a;
        color: #ccc;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-size: 14px;
    }
    a { color: #4fc3f7; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Header */
    .header {
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .header h1 { font-size: 18px; color: #e0e0e0; }
    .header .stats { font-size: 12px; color: #888; }
    .nav { font-size: 13px; display: flex; gap: 14px; }

    /* Toolbar */
    .filters {
        background: #222;
        padding: 10px 20px;
        border-bottom: 1px solid #333;
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
    }
    .filters label { color: #999; font-size: 12px; }
    .filters select {
        background: #333;
        color: #ccc;
        border: 1px solid #444;
        padding: 4px 8px;
        font-size: 13px;
    }
    .filters button {
        background: #66bb6a;
        color: #111;
        border: none;
        padding: 5px 14px;
        cursor: pointer;
        font-size: 13px;
    }
    .filters button:hover { background: #81c784; }
    .filters .updated { color: #777; font-size: 12px; margin-left: auto; }
    .filters .updated.error { color: #e57373; }

    /* Table */
    .content { padding: 10px 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
        background: #2a2a2a;
        color: #aaa;
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid #444;
    }
    td {
        padding: 6px 10px;
        border-bottom: 1px solid #2a2a2a;
        vertical-align: top;
    }
    tr:hover { background: #252525; }
    tr td:first-child { border-left: 3px solid #555; }

    /* ≥2 watchers = possible double attack */
    tr.double { background: #3a2e14; }
    tr.double:hover { background: #46371a; }
    tr.double td:first-child { border-left-color: #ff9800; }
    .double-flag { color: #ffb74d; font-weight: bold; margin-top: 3px; }

    .target-name { color: #e0e0e0; }
    .type { color: #999; }
    .type-camp { color: #8bc34a; }
    .type-outpost { color: #4fc3f7; }
    .type-base { color: #ff9800; }
    .type-player { color: #e57373; }
    .watcher { white-space: nowrap; }
    .watcher + .watcher { margin-top: 3px; }
    .ago { color: #777; font-size: 12px; }

    /* Empty / loading */
    .loading { text-align: center; padding: 40px; color: #666; }
    tr td.loading:first-child { border-left: none; }

    /* Mobile: rows become cards */
    @media (max-width: 640px) {
        .header, .filters, .content { padding-left: 12px; padding-right: 12px; }
        .filters .updated { margin-left: 0; width: 100%; }
        thead { display: none; }
        table, tbody, tr, td { display: block; width: 100%; }
        tr { border: 1px solid #2a2a2a; border-left: 3px solid #555; margin-bottom: 8px; }
        tr.double { border-left-color: #ff9800; }
        tr td:first-child { border-left: none; }
        td { border-bottom: none; padding: 4px 10px; }
        td[data-label]::before {
            content: attr(data-label);
            display: inline-block;
            width: 72px;
            color: #777;
            font-size: 12px;
        }
        td.target-cell { padding-top: 8px; font-size: 14px; }
        td.watchers-cell { display: flex; }
        td.watchers-cell::before { flex: none; }
    }
    /* Website session (session.js) */
    .user { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }
    .user strong { color: #e0e0e0; font-weight: normal; }
    .user form { display: inline; }
    .user button {
        background: #444; color: #ccc; border: none; border-radius: 3px;
        padding: 3px 8px; font-size: 12px; cursor: pointer;
    }
    .user button:hover { background: #666; }
</style>
</head>
<body>

<div class="header">
    <h1><span data-i18n="targetsTitle">🎯 Alliance Target Watch</span> <span id="worldTitle"></span></h1>
    <div class="nav">
        <a href="./" data-i18n="navBases">⚔ Bases</a>
        <span class="stats" id="stats" data-i18n="loading">Loading...</span>
        <span class="user" id="userBox"></span>
        <span class="lang-switch" id="langSwitch"></span>
    </div>
</div>

<div class="filters">
    <div id="worldPicker" style="display:none">
        <label for="worldSelect" data-i18n="world">World:</label>
        <select id="worldSelect"></select>
    </div>
    <button onclick="loadTargets()" data-i18n="refresh">↻ Refresh</button>
    <span class="updated" id="updated"></span>
</div>

<div class="content">
    <table>
        <thead>
            <tr>
                <th data-i18n="colTarget">Target</th>
                <th data-i18n="colCoord">Coord</th>
                <th data-i18n="colLevel">Level</th>
                <th data-i18n="colType">Type</th>
                <th data-i18n="colWatchers">Watchers</th>
            </tr>
        </thead>
        <tbody id="targetBody">
            <tr><td colspan="5" class="loading" data-i18n="loading">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script src="static/session.js"></script>
<script>
const API = '.';
const REFRESH_MS = 20000;
const WORLD_KEY = 'st-targets-world';

let worlds = [];        // [{ worldId, targets: [...] }]
let serverTime = 0;     // unix s, from the response — ages don't depend on the browser clock
let ttl = 600;
let selectedWorld = readStoredWorld();
let lastStatus = null;  // {key, vars, error} of the "updated" line, re-translated on a language switch

async function loadTargets() {
    try {
        const resp = await fetch(`${API}/api/targets`, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
        const data = await resp.json();
        worlds = data.worlds || [];
        serverTime = data.serverTime || Math.floor(Date.now() / 1000);
        ttl = data.ttl || 600;
        showStatus({ key: 'updated', vars: { time: new Date().toLocaleTimeString(), s: REFRESH_MS / 1000 }, error: false });
    } catch (e) {
        showStatus({ key: 'refreshFailed', vars: { msg: e.message, s: REFRESH_MS / 1000 }, error: true });
        if (!worlds.length) {
            document.getElementById('targetBody').innerHTML =
                `<tr><td colspan="5" class="loading">${esc(T('error', { msg: e.message }))}</td></tr>`;
        }
        return;
    }
    renderWorldPicker();
    render();
}

function showStatus(status) {
    lastStatus = status;
    const updated = document.getElementById('updated');
    updated.classList.toggle('error', status.error);
    updated.textContent = T(status.key, status.vars);
}

function renderWorldPicker() {
    const ids = worlds.map(w => w.worldId);
    if (!ids.includes(selectedWorld)) selectedWorld = ids[0] ?? null;

    const picker = document.getElementById('worldPicker');
    const select = document.getElementById('worldSelect');
    picker.style.display = ids.length > 1 ? '' : 'none';
    select.innerHTML = worlds.map(w =>
        `<option value="${w.worldId}">${esc(T('worldOption', { id: w.worldId, n: w.targets.length }))}</option>`
    ).join('');
    if (selectedWorld !== null) select.value = String(selectedWorld);
}

function render() {
    const tbody = document.getElementById('targetBody');
    const world = worlds.find(w => w.worldId === selectedWorld);
    document.getElementById('worldTitle').textContent = world ? T('worldTitle', { id: world.worldId }) : '';

    // Drop watchers past the TTL (the backend does this too, on every request)
    const targets = (world ? world.targets : [])
        .map(t => ({ ...t, watchers: t.watchers.filter(w => serverTime - w.timestamp <= ttl) }))
        .filter(t => t.watchers.length)
        .sort((a, b) => (b.watchers.length - a.watchers.length) || (latest(b) - latest(a)));

    const watcherCount = new Set(targets.flatMap(t => t.watchers.map(w => w.playerId))).size;
    const doubles = targets.filter(t => t.watchers.length >= 2).length;
    document.getElementById('stats').textContent =
        T('targetsStats', { targets: targets.length, watchers: watcherCount }) + (doubles ? T('targetsDoubles', { n: doubles }) : '');

    if (!targets.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="loading">${esc(T('noWatchers'))}</td></tr>`;
        return;
    }

    tbody.innerHTML = targets.map(t => {
        const double = t.watchers.length >= 2;
        const type = (t.targetType || '').toLowerCase();
        const watchers = t.watchers.map(w =>
            `<div class="watcher">${esc(w.playerName)} <span class="ago">(${ago(serverTime - w.timestamp)})</span></div>`
        ).join('');
        return `<tr class="${double ? 'double' : ''}">
            <td class="target-cell" data-label="${esc(T('colTarget'))}"><span class="target-name">${esc(t.targetName || '?')}</span></td>
            <td data-label="${esc(T('colCoord'))}">${t.targetX}:${t.targetY}</td>
            <td data-label="${esc(T('colLevel'))}">L${Math.floor(t.targetLevel)}</td>
            <td data-label="${esc(T('colType'))}"><span class="type type-${esc(type)}">${esc(type || '—')}</span></td>
            <td class="watchers-cell" data-label="${esc(T('colWatchers'))}"><div>${watchers}${double ? `<div class="double-flag">${esc(T('doubleFlag', { n: t.watchers.length }))}</div>` : ''}</div></td>
        </tr>`;
    }).join('');
}

function latest(t) {
    return Math.max(...t.watchers.map(w => w.timestamp));
}

function ago(seconds) {
    const min = Math.floor(Math.max(0, seconds) / 60);
    return min < 1 ? T('justNow') : T('minAgo', { n: min });
}

function esc(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function readStoredWorld() {
    try {
        const v = parseInt(localStorage.getItem(WORLD_KEY), 10);
        return Number.isNaN(v) ? null : v;
    } catch { return null; }
}

document.getElementById('worldSelect').addEventListener('change', (e) => {
    selectedWorld = parseInt(e.target.value, 10);
    try { localStorage.setItem(WORLD_KEY, String(selectedWorld)); } catch { /* private mode */ }
    render();
});

// Language switch: re-render what was built in JS
document.addEventListener('shockr-lang', () => {
    if (lastStatus) showStatus(lastStatus);
    renderWorldPicker();
    render();
});

loadTargets();
setInterval(loadTargets, REFRESH_MS);
</script>
</body>
</html>
