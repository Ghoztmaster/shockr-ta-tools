<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shockr Alliance Scanner</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #1a1a1a;
        color: #ccc;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-size: 14px;
    }
    a { color: #4fc3f7; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Header */
    .header {
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .header h1 { font-size: 18px; color: #e0e0e0; }
    .header .stats { font-size: 12px; color: #888; }

    /* Filters */
    .filters {
        background: #222;
        padding: 10px 20px;
        border-bottom: 1px solid #333;
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
    }
    .filters label { color: #999; font-size: 12px; }
    .filters select, .filters input {
        background: #333;
        color: #ccc;
        border: 1px solid #444;
        padding: 4px 8px;
        font-size: 13px;
    }
    .filters button {
        background: #4fc3f7;
        color: #111;
        border: none;
        padding: 5px 14px;
        cursor: pointer;
        font-size: 13px;
    }
    .filters button:hover { background: #81d4fa; }

    /* Table */
    .content { padding: 10px 20px; }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }
    th {
        background: #2a2a2a;
        color: #aaa;
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid #444;
        cursor: pointer;
        user-select: none;
    }
    th:hover { color: #fff; }
    td {
        padding: 6px 10px;
        border-bottom: 1px solid #2a2a2a;
    }
    tr:hover { background: #252525; }
    tr.fresh td { border-left: 3px solid #4caf50; }
    tr.recent td { border-left: 3px solid #ff9800; }
    tr.old td { border-left: 3px solid #555; }

    /* Detail panel */
    .detail-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.8);
        z-index: 100;
        overflow-y: auto;
    }
    .detail-panel {
        background: #1e1e1e;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #444;
        border-radius: 4px;
    }
    .detail-panel h2 {
        color: #e0e0e0;
        margin-bottom: 10px;
    }
    .detail-panel h3 {
        color: #999;
        margin: 15px 0 8px;
        font-size: 13px;
    }
    .detail-close {
        float: right;
        background: #444;
        color: #ccc;
        border: none;
        padding: 4px 12px;
        cursor: pointer;
        font-size: 16px;
    }
    .detail-close:hover { background: #666; }
    .detail-info {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
        margin-bottom: 15px;
    }
    .detail-info div { color: #999; }
    .detail-info span { color: #ccc; font-weight: bold; }

    /* Grid */
    .grid-container {
        display: inline-block;
        border: 1px solid #444;
        margin: 10px 0;
    }
    .grid-row { display: flex; }
    .grid-label {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: #777;
    }
    .grid-label.row-label { width: 16px; }
    .grid-cell {
        width: 28px;
        height: 28px;
        border: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: rgba(255,255,255,0.6);
        position: relative;
    }
    .grid-cell.empty { background: #1a1a1a; }
    .grid-cell.crystal { background: #1a237e; }
    .grid-cell.tiberium { background: #1b5e20; }
    .grid-cell.unknown { background: #333; }
    .grid-cell.has-unit {
        outline: 2px solid #ff9800;
        outline-offset: -2px;
        z-index: 1;
    }

    /* Unit list */
    .unit-section { margin-top: 10px; }
    .unit-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 4px;
    }
    .unit-item {
        background: #252525;
        padding: 4px 8px;
        font-size: 12px;
        border-left: 3px solid #666;
    }
    .unit-item.def { border-left-color: #4fc3f7; }
    .unit-item.off { border-left-color: #f44336; }
    .unit-level { color: #ff9800; font-weight: bold; }
    .unit-pos { color: #666; font-size: 11px; }

    /* History */
    .history { margin-top: 15px; }
    .history-item {
        font-size: 12px;
        color: #777;
        padding: 2px 0;
    }

    /* Faction colors */
    .faction-gdi { color: #ffd600; }
    .faction-nod { color: #f44336; }
    .faction-for { color: #9e9e9e; }

    /* Alliance overview */
    .overview {
        background: #222;
        border-bottom: 1px solid #333;
        padding: 8px 20px;
        display: flex;
        gap: 20px;
        font-size: 12px;
        color: #777;
        flex-wrap: wrap;
    }
    .overview-item { display: flex; gap: 5px; }
    .overview-item strong { color: #aaa; }

    /* Loading */
    .loading { text-align: center; padding: 40px; color: #666; }
</style>
</head>
<body>

<div class="header">
    <h1>⚔ Shockr Alliance Scanner</h1>
    <a href="targets" style="font-size:13px;margin-left:auto;margin-right:15px;">🎯 Target Watch</a>
    <div class="stats" id="stats">Loading...</div>
</div>

<div id="overview" class="overview" style="display:none"></div>

<div class="filters">
    <div>
        <label>World:</label>
        <select id="filterWorld"><option value="">All</option></select>
    </div>
    <div>
        <label>Type:</label>
        <select id="filterType">
            <option value="">All</option>
            <option value="Camp">Camp</option>
            <option value="Outpost">Outpost</option>
            <option value="Base">Base</option>
        </select>
    </div>
    <div>
        <label>Min Level:</label>
        <input type="number" id="filterLevel" min="1" max="65" value="" placeholder="any" style="width:60px">
    </div>
    <div>
        <label>Age:</label>
        <select id="filterAge">
            <option value="1">&lt; 1 hour</option>
            <option value="6">&lt; 6 hours</option>
            <option value="24">&lt; 24 hours</option>
            <option value="168" selected>&lt; 7 days</option>
        </select>
    </div>
    <button onclick="loadBases()">🔍 Filter</button>
    <button onclick="loadBases()" style="background:#66bb6a">↻ Refresh</button>
</div>

<div class="content">
    <table id="baseTable">
        <thead>
            <tr>
                <th data-sort="name">Name</th>
                <th data-sort="owner">Owner</th>
                <th data-sort="level_base">Base</th>
                <th data-sort="level_off">Off</th>
                <th data-sort="level_def">Def</th>
                <th data-sort="faction">Faction</th>
                <th data-sort="x">Coords</th>
                <th data-sort="scanned_by">Scanner</th>
                <th data-sort="scanned_at">Scanned</th>
            </tr>
        </thead>
        <tbody id="baseBody">
            <tr><td colspan="9" class="loading">Loading...</td></tr>
        </tbody>
    </table>
</div>

<!-- Detail overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
    <div class="detail-panel" id="detailPanel"></div>
</div>

<script>
const API = '.';
let allBases = [];
let sortKey = 'scanned_at';
let sortDir = -1;
const worldNames = {};

// ─── Base62 decoder ─────────────────────────────────────────
const B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
const B62_SEP = '.';
const B62_DEC = {};
for (let i = 0; i < B62.length; i++) B62_DEC[B62.charCodeAt(i)] = i;

function b62decode(str, offset = 0, max = 6) {
    let mul = 1, val = 0, bytes = 0;
    for (let i = 0; i < max; i++) {
        bytes++;
        const idx = offset + i;
        if (idx >= str.length) break;
        const code = str.charCodeAt(idx);
        if (code === B62_SEP.charCodeAt(0)) break;
        const cv = B62_DEC[code];
        if (cv === undefined) break;
        val += mul * cv;
        mul *= 62;
    }
    return { value: val, bytes };
}

function b62unpack(str) {
    if (!str) return [];
    const out = [];
    let off = 0;
    while (off < str.length) {
        const { value, bytes } = b62decode(str, off);
        out.push(value);
        off += bytes;
    }
    return out;
}

// ─── Layout decoder ─────────────────────────────────────────
function decodeTiles(tilesStr) {
    if (!tilesStr || tilesStr === 'test') return null;
    const rows = b62unpack(tilesStr);
    const grid = [];
    for (let y = 0; y < Math.min(rows.length, 16); y++) {
        const row = [];
        for (let x = 0; x < 9; x++) {
            row.push((rows[y] >> (3 * x)) & 7);
        }
        grid.push(row);
    }
    return grid;
}

// ─── Unit decoder ───────────────────────────────────────────
// UnitPacker format: { xy: 8 bits, id: 9 bits, level: 7 bits }
function decodeUnits(unitStr) {
    if (!unitStr) return [];
    const packed = b62unpack(unitStr);
    return packed.map(n => {
        const xy = n & 0xFF;
        const id = (n >> 8) & 0x1FF;
        const level = (n >> 17) & 0x7F;
        return { x: xy % 9, y: Math.floor(xy / 9), id, level };
    });
}

// Unit label: displayName, else tech name, else "ID {type}" (scans from before unit_names)
function unitLabel(id, names) {
    const n = names && names[id];
    if (n && n.displayName) return n.displayName;
    if (n && n.name) return n.name;
    return `ID ${id}`;
}

// ─── Faction names ──────────────────────────────────────────
const FACTIONS = { 1: 'GDI', 2: 'NOD', 3: 'Forgotten', 4: 'Forgotten', 5: 'Forgotten', 6: 'Forgotten', 7: 'Forgotten', 8: 'Forgotten' };
function factionName(f) { return FACTIONS[f] || `F${f}`; }
function factionClass(f) {
    if (f === 1) return 'faction-gdi';
    if (f === 2) return 'faction-nod';
    return 'faction-for';
}

// ─── Resource type names ────────────────────────────────────
const RES_TYPES = { 0: 'empty', 1: 'crystal', 2: 'tiberium' };
function resClass(t) { return RES_TYPES[t] || 'unknown'; }

// ─── Time formatting ────────────────────────────────────────
function timeAgo(isoStr) {
    if (!isoStr) return '—';
    const diff = Date.now() - new Date(isoStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
}

function freshness(isoStr) {
    if (!isoStr) return 'old';
    const diff = Date.now() - new Date(isoStr).getTime();
    if (diff < 3600000) return 'fresh';
    if (diff < 21600000) return 'recent';
    return 'old';
}

// ─── Load bases ─────────────────────────────────────────────
async function loadBases() {
    const world = document.getElementById('filterWorld').value;
    const level = document.getElementById('filterLevel').value;
    const age = document.getElementById('filterAge').value;
    const type = document.getElementById('filterType').value;

    let url = `${API}/api/bases?max_age_hours=${age}`;
    if (world) url += `&world_id=${world}`;
    if (level) url += `&min_level=${level}`;

    try {
        const resp = await fetch(url);
        const data = await resp.json();
        allBases = data.bases || [];
        for (const b of allBases) {
            if (b.world_name) worldNames[b.world_id] = b.world_name;
        }
        renderTable();
        updateStats();
        updateWorldFilter();
        updateOverview();
    } catch (e) {
        document.getElementById('baseBody').innerHTML =
            `<tr><td colspan="9" class="loading">Error: ${e.message}</td></tr>`;
    }
}

function getFilteredBases() {
    const type = document.getElementById('filterType').value;
    if (!type) return allBases;
    return allBases.filter(b => (b.name || '').toLowerCase().includes(type.toLowerCase()));
}

function updateStats() {
    const bases = getFilteredBases();
    const worlds = new Set(bases.map(b => b.world_id));
    const scanners = new Set(bases.map(b => b.scanned_by));
    document.getElementById('stats').textContent =
        `${bases.length} bases | ${worlds.size} world(s) | ${scanners.size} scanner(s)`;
}

function updateWorldFilter() {
    const select = document.getElementById('filterWorld');
    const current = select.value;
    const worlds = [...new Set(allBases.map(b => b.world_id))].sort((a,b) => a-b);
    select.innerHTML = '<option value="">All</option>' +
        worlds.map(w => {
            const name = worldNames[w] || w;
            return `<option value="${w}" ${w==current?'selected':''}>${name}</option>`;
        }).join('');
}

function updateOverview() {
    const el = document.getElementById('overview');
    if (allBases.length === 0) { el.style.display = 'none'; return; }

    // Per scanner
    const scannerCounts = {};
    for (const b of allBases) {
        const s = b.scanned_by || '?';
        scannerCounts[s] = (scannerCounts[s] || 0) + 1;
    }

    // Type counts
    const typeCounts = { Camp: 0, Outpost: 0, Base: 0, Other: 0 };
    for (const b of allBases) {
        const name = (b.name || '').toLowerCase();
        if (name.includes('camp')) typeCounts.Camp++;
        else if (name.includes('outpost')) typeCounts.Outpost++;
        else if (name.includes('base')) typeCounts.Base++;
        else typeCounts.Other++;
    }

    let html = '';
    html += `<div class="overview-item"><strong>Types:</strong> ${typeCounts.Camp} camps, ${typeCounts.Outpost} outposts, ${typeCounts.Base} bases`;
    if (typeCounts.Other > 0) html += `, ${typeCounts.Other} other`;
    html += '</div>';

    html += '<div class="overview-item"><strong>Scanners:</strong> ';
    html += Object.entries(scannerCounts)
        .sort((a,b) => b[1] - a[1])
        .map(([name, count]) => `${name} (${count})`)
        .join(', ');
    html += '</div>';

    el.innerHTML = html;
    el.style.display = 'flex';
}

// ─── Render table ───────────────────────────────────────────
function renderTable() {
    const filtered = getFilteredBases();
    const sorted = [...filtered].sort((a, b) => {
        let av = a[sortKey], bv = b[sortKey];
        if (typeof av === 'string') return sortDir * av.localeCompare(bv);
        return sortDir * ((av || 0) - (bv || 0));
    });

    const tbody = document.getElementById('baseBody');
    if (sorted.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="loading">No bases found</td></tr>';
        return;
    }

    tbody.innerHTML = sorted.map(b => `
        <tr class="${freshness(b.scanned_at)}" onclick="openDetail(${b.city_id}, ${b.world_id})" style="cursor:pointer">
            <td>${esc(b.name)}</td>
            <td>${esc(b.owner)}</td>
            <td>${b.level_base.toFixed(1)}</td>
            <td>${b.level_off.toFixed(1)}</td>
            <td>${b.level_def.toFixed(1)}</td>
            <td class="${factionClass(b.faction)}">${factionName(b.faction)}</td>
            <td>${b.x}:${b.y}</td>
            <td>${esc(b.scanned_by)}</td>
            <td title="${b.scanned_at}">${timeAgo(b.scanned_at)}</td>
        </tr>
    `).join('');
}

// Type filter triggers re-render without reload
document.getElementById('filterType').addEventListener('change', () => {
    renderTable();
    updateStats();
});

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

// ─── Sorting ────────────────────────────────────────────────
document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sortKey === key) sortDir *= -1;
        else { sortKey = key; sortDir = key === 'scanned_at' ? -1 : 1; }
        renderTable();
    });
});

// ─── Detail view ────────────────────────────────────────────
async function openDetail(cityId, worldId) {
    const overlay = document.getElementById('detailOverlay');
    const panel = document.getElementById('detailPanel');
    panel.innerHTML = '<div class="loading">Loading...</div>';
    overlay.style.display = 'block';

    try {
        const resp = await fetch(`${API}/api/base/${cityId}?world_id=${worldId}`);
        const base = await resp.json();
        renderDetail(base);
    } catch (e) {
        panel.innerHTML = `<p>Error: ${e.message}</p>`;
    }
}

function closeDetail() {
    document.getElementById('detailOverlay').style.display = 'none';
}

function renderDetail(b) {
    const panel = document.getElementById('detailPanel');
    const grid = decodeTiles(b.tiles);
    const defUnits = decodeUnits(b.defense_units);
    const offUnits = decodeUnits(b.offense_units);

    // Build a lookup of unit positions for grid overlay
    const unitPositions = new Set();
    for (const u of [...defUnits, ...offUnits]) {
        unitPositions.add(`${u.x},${u.y}`);
    }

    // Grid HTML
    let gridHtml = '';
    if (grid) {
        gridHtml = '<div class="grid-container">';
        // Column numbers 0-8 on top, row numbers on the left (0-based, as the game counts)
        gridHtml += '<div class="grid-row"><div class="grid-label row-label"></div>';
        for (let x = 0; x < (grid[0] || []).length; x++) {
            gridHtml += `<div class="grid-label">${x}</div>`;
        }
        gridHtml += '</div>';
        for (let y = 0; y < grid.length; y++) {
            gridHtml += `<div class="grid-row"><div class="grid-label row-label">${y}</div>`;
            for (let x = 0; x < grid[y].length; x++) {
                const t = grid[y][x];
                const hasUnit = unitPositions.has(`${x},${y}`) ? ' has-unit' : '';
                gridHtml += `<div class="grid-cell ${resClass(t)}${hasUnit}" title="(${x},${y}) type=${t}"></div>`;
            }
            gridHtml += '</div>';
        }
        gridHtml += '</div>';
    } else {
        gridHtml = '<p style="color:#666">No tile data available</p>';
    }

    // Defense units
    let defHtml = '';
    if (defUnits.length > 0) {
        defHtml = `<h3>🛡 Defense Units (${defUnits.length})</h3><div class="unit-grid">` +
            defUnits.map(u =>
                `<div class="unit-item def">` +
                `${esc(unitLabel(u.id, b.unit_names))} <span class="unit-level">Lv${u.level}</span> ` +
                `<span class="unit-pos">(${u.x},${u.y})</span></div>`
            ).join('') + '</div>';
    }

    // Offense units
    let offHtml = '';
    if (offUnits.length > 0) {
        offHtml = `<h3>⚔ Offense Units (${offUnits.length})</h3><div class="unit-grid">` +
            offUnits.map(u =>
                `<div class="unit-item off">` +
                `${esc(unitLabel(u.id, b.unit_names))} <span class="unit-level">Lv${u.level}</span> ` +
                `<span class="unit-pos">(${u.x},${u.y})</span></div>`
            ).join('') + '</div>';
    }

    // History
    let historyHtml = '';
    if (b.history && b.history.length > 0) {
        historyHtml = '<div class="history"><h3>Scan History (' + b.scan_count + ' scans)</h3>' +
            b.history.map(h =>
                `<div class="history-item">v${h.version} — ${esc(h.scanned_by)} — ${timeAgo(h.scanned_at)}</div>`
            ).join('') + '</div>';
    }

    panel.innerHTML = `
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <h2>${esc(b.name)}</h2>
        <div class="detail-info">
            <div>Owner: <span>${esc(b.owner)}</span></div>
            <div>Alliance: <span>${esc(b.alliance) || '—'}</span></div>
            <div>Faction: <span class="${factionClass(b.faction)}">${factionName(b.faction)}</span></div>
            <div>Coords: <span>${b.x}:${b.y}</span></div>
            <div>Base Level: <span>${b.level_base.toFixed(1)}</span></div>
            <div>Offense: <span>${b.level_off.toFixed(1)}</span></div>
            <div>Defense: <span>${b.level_def.toFixed(1)}</span></div>
            <div>Version: <span>${b.version}</span></div>
            <div>Scanned by: <span>${esc(b.scanned_by)}</span></div>
            <div>Scanned: <span>${timeAgo(b.scanned_at)}</span></div>
        </div>
        <h3>Base Layout (9×16)</h3>
        ${gridHtml}
        ${defHtml}
        ${offHtml}
        ${historyHtml}
    `;
}

// ─── Keyboard ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
});

// ─── Init ───────────────────────────────────────────────────
loadBases();
</script>
</body>
</html>
